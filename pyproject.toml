[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeflow"
version = "0.1.0"
description = "Verified periodic PDE numerics and specialist flow reconstruction research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.5,<3", "numpy>=2.0,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
workbench = ["fastapi==0.115.6", "uvicorn==0.34.0", "httpx==0.28.1"]

[project.scripts]
pdeflow = "pdeflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdeflow = ["presets/*.json", "coordinate/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
